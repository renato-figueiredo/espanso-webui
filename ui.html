<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espanso WebUI</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --panel2:#f0f2f5; --text:#1d2330; --muted:#697386;
  --border:#dde1e8; --accent:#3b6df0; --accent-fg:#fff; --accent-soft:#e6edff;
  --danger:#d33f49; --ok:#1f9d63; --warn:#b7791f; --code:#f3f4f7;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12151b; --panel:#1b1f27; --panel2:#232833; --text:#e6e9ef; --muted:#8c96a8;
  --border:#2b313d; --accent:#6c93ff; --accent-fg:#0d1220; --accent-soft:#242e4a;
  --danger:#ff6b75; --ok:#4cd08f; --warn:#e0b04d; --code:#161a21;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);
  border-bottom:1px solid var(--border);flex-wrap:wrap}
header h1{font-size:16px;margin:0;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-fg);
  display:grid;place-items:center;font-weight:700;font-size:13px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  background:var(--panel2);font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--ok)} .pill.bad .dot{background:var(--danger)}
.btn{border:1px solid var(--border);background:var(--panel);padding:6px 12px;border-radius:8px;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)} .btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
select,input[type=text],input[type=password],textarea{background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:7px 10px;width:100%}
select{width:auto}
input:focus,textarea:focus,select:focus,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
textarea{resize:vertical;font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;font-size:13px;min-height:150px}
main{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0}
aside{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:9px;text-align:center;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;background:none;border:0;border-bottom:2px solid transparent}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.search{padding:10px}
.list{overflow:auto;flex:1;padding:0 8px 8px}
.item{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.item:hover{background:var(--panel2)}
.item.sel{background:var(--accent-soft);border-color:var(--accent)}
.item .trg{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;display:flex;gap:6px;align-items:center}
.item .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--panel2);color:var(--muted);font-weight:500;font-family:system-ui}
.badge.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.count{padding:8px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}
section.editor{overflow:auto;padding:20px;min-height:0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
  padding:18px;max-width:860px;margin:0 auto 16px}
.card h2{margin:0 0 12px;font-size:15px}
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-weight:600;font-size:12px;margin-bottom:4px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.hint{color:var(--muted);font-size:12px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--border);background:var(--panel2);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;font-family:ui-monospace,Menlo,monospace}
.chip:hover{border-color:var(--accent);color:var(--accent)}
details{margin-top:6px} summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.check input{margin-top:3px}
.msg{padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:13px;background:var(--panel2)}
.msg.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.msg.err{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty b{display:block;font-size:16px;color:var(--text);margin-bottom:6px}
.savebar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;justify-content:flex-end;max-width:860px;margin:0 auto;padding:6px 0}
.dirty{color:var(--warn);font-weight:600;font-size:12px}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--panel);color:var(--text);
  padding:0;width:min(720px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,14,22,.55)}
dialog .hd{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;display:flex;justify-content:space-between}
dialog .bd{padding:16px 18px;max-height:60vh;overflow:auto}
dialog .ft{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
pre.code{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;
  font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0;white-space:pre}
.gv{display:grid;grid-template-columns:160px 110px 1fr auto;gap:8px;align-items:start;margin-bottom:10px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--bg);padding:10px 16px;
  border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:99;max-width:420px}
.toast.show{opacity:1;transform:none}
@media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:40% 1fr}aside{border-right:0;border-bottom:1px solid var(--border)}
  .grid2,.gv{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1><span class="logo">E</span> Espanso WebUI</h1>
  <select id="fileSel" title=""></select>
  <button class="btn sm" id="btnNewFile"></button>
  <span class="pill" id="status"><span class="dot"></span><span id="statusTxt"></span></span>
  <span class="spacer"></span>
  <select id="langSel" title="Language / Idioma"><option value="en">EN</option><option value="pt">PT</option></select>
  <button class="btn" id="btnImport"></button>
  <button class="btn" id="btnYaml"></button>
  <button class="btn" id="btnBackups"></button>
  <button class="btn danger" id="btnQuit"></button>
  <input type="file" id="fileImport" accept=".json,application/json" hidden>
</header>
<main>
  <aside>
    <div class="tabs">
      <button class="tab active" id="tabSnip"></button>
      <button class="tab" id="tabVars"></button>
    </div>
    <div class="search row" style="flex-wrap:nowrap"><input type="text" id="q"><button class="btn primary" id="btnNew" style="white-space:nowrap"></button></div>
    <div class="list" id="list"></div>
    <div class="count" id="count"></div>
  </aside>
  <section class="editor" id="editor"></section>
</main>

<dialog id="dlg"><div class="hd"><span id="dlgT"></span><button class="btn sm" id="dlgX">✕</button></div>
  <div class="bd" id="dlgB"></div><div class="ft" id="dlgF"></div></dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const LANG = (() => {
  let v = new URLSearchParams(location.search).get("lang");
  try { v = v || localStorage.getItem("ewui.lang"); } catch {}
  v = v || navigator.language || "en";
  return v.toLowerCase().startsWith("pt") ? "pt" : "en";
})();
const I18N = {
  pt: {
    newSnippet:"+ Novo snippet", newFile:"+ Arquivo", import:"Importar Beeftext", yaml:"Ver YAML", backups:"Backups", quit:"Encerrar",
    snippets:"Snippets", globalVars:"Variáveis", search:"Buscar snippets…",
    espansoOk:"espanso ativo", espansoOff:"espanso parado", espansoNone:"espanso não encontrado",
    count:n=>`${n} snippet${n===1?"":"s"}`, countVars:n=>`${n} variáve${n===1?"l":"is"}`,
    emptyT:"Nenhum snippet selecionado", emptyD:"Escolha um item à esquerda ou crie um novo.",
    trigger:"Gatilho", triggerHint:"O que você digita. Vários gatilhos: um por linha.",
    label:"Descrição", labelHint:"Opcional. Só para você se achar depois.",
    replace:"Texto que será inserido", insert:"Inserir:",
    cursor:"Cursor", tab:"Tab", enter:"Enter", date:"Data", clip:"Área de transf.", globalv:"Variável…",
    advanced:"Opções avançadas", mode:"Modo de digitação", modeAuto:"Automático", modeKeys:"Digitar teclas (permite Tab/Enter)", modeClip:"Colar (mais rápido, bom para textos longos)",
    leftWord:"Só no início de uma palavra", leftWordHint:"Evita disparar no meio de outra palavra.",
    word:"Palavra inteira (dispara ao digitar espaço/pontuação)", propagate:"Acompanhar maiúsculas do que foi digitado",
    varsJson:"Variáveis do snippet (JSON, avançado)", extra:"Campos avançados preservados (somente leitura)",
    save:"Salvar arquivo", saved:"Salvo. O espanso recarrega sozinho.", dirty:"● alterações não salvas",
    del:"Excluir", dup:"Duplicar", delConfirm:"Excluir este snippet?",
    dupTrig:"Gatilho repetido em outro snippet.", emptyTrig:"Gatilho vazio.", spaceTrig:"Gatilho com espaço pode não funcionar como esperado.",
    noReplace:"Este item não tem texto simples (usa imagem/outro recurso). Edição limitada.",
    gvNew:"+ Nova variável", gvName:"Nome", gvType:"Tipo", gvValue:"Valor", gvHint:"Use no texto como {{nome}}. Valores do tipo echo ficam ocultos até você clicar no olho.",
    gvOther:"Parâmetros (JSON)", show:"Mostrar", hide:"Ocultar",
    importTitle:"Importar do Beeftext", importPick:"Escolha o arquivo JSON exportado do Beeftext (Arquivo → Exportar).",
    importFound:n=>`${n} combo(s) convertido(s).`, importSkipDup:"Pular gatilhos que já existem", importAdd:"Adicionar ao arquivo",
    importWarn:"Avisos da conversão", importNote:"Nada é gravado até você clicar em “Salvar arquivo”.",
    yamlTitle:"YAML deste arquivo", copy:"Copiar", copied:"Copiado",
    backupTitle:"Backups automáticos", backupNone:"Ainda não há backups.", backupHint:"Criados automaticamente antes de cada gravação (últimos 30 por arquivo).", view:"Ver", restore:"Restaurar", restoreOk:"Restaurado.",
    newFileName:"Nome do novo arquivo (ex.: trabalho)", create:"Criar", cancel:"Cancelar", close:"Fechar",
    unsaved:"Há alterações não salvas. Descartar?", conflict:"O arquivo mudou no disco. Recarregue antes de salvar.",
    quitConfirm:"Encerrar o servidor local?", bye:"Servidor encerrado. Pode fechar esta aba.",
    reload:"Recarregar do disco", error:"Erro", dir:"Pasta:", adv:"avançado", emptyShort:"(vazio)", noFiles:"Nenhum arquivo .yml em"
  },
  en: {
    newSnippet:"+ New snippet", newFile:"+ File", import:"Import Beeftext", yaml:"View YAML", backups:"Backups", quit:"Quit",
    snippets:"Snippets", globalVars:"Variables", search:"Search snippets…",
    espansoOk:"espanso running", espansoOff:"espanso stopped", espansoNone:"espanso not found",
    count:n=>`${n} snippet${n===1?"":"s"}`, countVars:n=>`${n} variable${n===1?"":"s"}`,
    emptyT:"No snippet selected", emptyD:"Pick one on the left or create a new one.",
    trigger:"Trigger", triggerHint:"What you type. Multiple triggers: one per line.",
    label:"Description", labelHint:"Optional. Just so you can find it later.",
    replace:"Text to insert", insert:"Insert:",
    cursor:"Cursor", tab:"Tab", enter:"Enter", date:"Date", clip:"Clipboard", globalv:"Variable…",
    advanced:"Advanced options", mode:"Typing mode", modeAuto:"Automatic", modeKeys:"Type keystrokes (allows Tab/Enter)", modeClip:"Paste (faster, good for long text)",
    leftWord:"Only at the start of a word", leftWordHint:"Avoids firing in the middle of another word.",
    word:"Whole word (fires on space/punctuation)", propagate:"Follow the capitalization you typed",
    varsJson:"Snippet variables (JSON, advanced)", extra:"Preserved advanced fields (read-only)",
    save:"Save file", saved:"Saved. espanso reloads by itself.", dirty:"● unsaved changes",
    del:"Delete", dup:"Duplicate", delConfirm:"Delete this snippet?",
    dupTrig:"Trigger repeated in another snippet.", emptyTrig:"Empty trigger.", spaceTrig:"A trigger with spaces may not behave as expected.",
    noReplace:"This item has no plain text (uses image/other feature). Limited editing.",
    gvNew:"+ New variable", gvName:"Name", gvType:"Type", gvValue:"Value", gvHint:"Use in text as {{name}}. echo values stay hidden until you click the eye.",
    gvOther:"Params (JSON)", show:"Show", hide:"Hide",
    importTitle:"Import from Beeftext", importPick:"Choose the JSON file exported from Beeftext (File → Export).",
    importFound:n=>`${n} combo(s) converted.`, importSkipDup:"Skip triggers that already exist", importAdd:"Add to file",
    importWarn:"Conversion warnings", importNote:"Nothing is written until you click “Save file”.",
    yamlTitle:"This file's YAML", copy:"Copy", copied:"Copied",
    backupTitle:"Automatic backups", backupNone:"No backups yet.", backupHint:"Created automatically before each write (last 30 per file).", view:"View", restore:"Restore", restoreOk:"Restored.",
    newFileName:"New file name (e.g. work)", create:"Create", cancel:"Cancel", close:"Close",
    unsaved:"You have unsaved changes. Discard?", conflict:"The file changed on disk. Reload before saving.",
    quitConfirm:"Stop the local server?", bye:"Server stopped. You can close this tab.",
    reload:"Reload from disk", error:"Error", dir:"Folder:", adv:"advanced", emptyShort:"(empty)", noFiles:"No .yml file in"
  }
};
const t = (k, ...a) => { const v = I18N[LANG][k]; return typeof v === "function" ? v(...a) : (v ?? k); };

const $ = id => document.getElementById(id);
const S = { info:null, file:null, data:null, mtime:0, tab:"snip", sel:-1, dirty:false, q:"" };

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "text") n.textContent = v;
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function toast(msg) { const x = $("toast"); x.textContent = msg; x.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => x.classList.remove("show"), 2800); }

async function api(path, body) {
  const opt = { headers: { "X-Token": TOKEN } };
  if (body !== undefined) { opt.method = "POST"; opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, opt);
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) { const e = new Error(data.error || r.statusText); e.status = r.status; throw e; }
  return data;
}

// ---------- modelo ----------
const KNOWN = ["trigger","triggers","label","replace","force_mode","left_word","word","propagate_case","vars"];
const trigOf = m => m.triggers ? m.triggers.join("\n") : (m.trigger ?? "");
const markDirty = () => { S.dirty = true; renderBar(); };
function allTriggers(except) {
  const c = {};
  S.data.matches.forEach((m, i) => { if (i !== except) (m.triggers || (m.trigger != null ? [m.trigger] : [])).forEach(x => c[x] = 1); });
  return c;
}

// ---------- carregamento ----------
async function init() {
  $("langSel").value = LANG;
  $("langSel").addEventListener("change", e => { try { localStorage.setItem("ewui.lang", e.target.value); } catch {} const u = new URL(location.href); u.searchParams.delete("lang"); if (!S.dirty || confirm(t("unsaved"))) { S.dirty = false; location.href = u; } else e.target.value = LANG; });
  document.documentElement.lang = LANG === "pt" ? "pt-BR" : "en";
  $("btnNewFile").textContent = t("newFile"); $("btnImport").textContent = t("import"); $("btnNew").textContent = t("newSnippet");
  $("btnYaml").textContent = t("yaml"); $("btnBackups").textContent = t("backups");
  $("btnQuit").textContent = t("quit"); $("tabSnip").textContent = t("snippets");
  $("tabVars").textContent = t("globalVars"); $("q").placeholder = t("search");
  await refreshInfo();
  const pref = localStorage.getItem("ewui.file");
  const files = S.info.files;
  if (files.length) await openFile(files.includes(pref) ? pref : files[0]);
  else { S.file = null; render(); }
}
async function refreshInfo() {
  S.info = await api("/api/info");
  const sel = $("fileSel"); sel.replaceChildren();
  S.info.files.forEach(f => sel.append(el("option", { value: f, text: f })));
  if (S.file) sel.value = S.file;
  sel.title = t("dir") + " " + S.info.dir;
  const e = S.info.espanso, p = $("status");
  p.className = "pill " + (e.running ? "ok" : "bad");
  $("statusTxt").textContent = !e.installed ? t("espansoNone") : e.running ? t("espansoOk") : t("espansoOff");
}
async function openFile(name) {
  const d = await api("/api/file?name=" + encodeURIComponent(name));
  S.file = name; S.data = d; S.mtime = d.mtime; S.sel = d.matches.length ? 0 : -1; S.dirty = false;
  localStorage.setItem("ewui.file", name); $("fileSel").value = name; render();
}
async function save() {
  try {
    const r = await api("/api/save", { name: S.file, mtime: S.mtime, matches: S.data.matches, global_vars: S.data.global_vars, extra: S.data.extra });
    S.mtime = r.mtime; S.dirty = false; renderBar(); toast(t("saved")); refreshInfo();
  } catch (e) {
    if (e.status === 409) { if (confirm(t("conflict") + "\n\n" + t("reload") + "?")) { await openFile(S.file); } }
    else alert(t("error") + ": " + e.message);
  }
}
const confirmDiscard = () => !S.dirty || confirm(t("unsaved"));

// ---------- render ----------
function render() { renderTabs(); renderList(); renderEditor(); renderBar(); }
function renderTabs() { $("tabSnip").classList.toggle("active", S.tab === "snip"); $("tabVars").classList.toggle("active", S.tab === "vars"); }
function renderBar() { const d = document.getElementById("dirtyMark"); if (d) d.textContent = S.dirty ? t("dirty") : ""; }

function matchesFilter(m) {
  const q = S.q.trim().toLowerCase(); if (!q) return true;
  return [trigOf(m), m.label || "", typeof m.replace === "string" ? m.replace : ""].some(s => s.toLowerCase().includes(q));
}
function renderList() {
  const list = $("list"); list.replaceChildren();
  if (!S.data) { $("count").textContent = ""; return; }
  if (S.tab === "vars") {
    S.data.global_vars.forEach((g, i) => list.append(el("div", { class: "item" + (S.sel === i ? " sel" : ""), onclick: () => { S.sel = i; renderList(); renderEditor(); } },
      el("div", { class: "trg" }, g.name || "?", el("span", { class: "badge", text: g.type || "" })))));
    $("count").textContent = t("countVars", S.data.global_vars.length);
    return;
  }
  let shown = 0;
  S.data.matches.forEach((m, i) => {
    if (!matchesFilter(m)) return; shown++;
    const adv = !("replace" in m) || "vars" in m || "regex" in m || "form" in m;
    list.append(el("div", { class: "item" + (S.sel === i ? " sel" : ""), onclick: () => { S.sel = i; renderList(); renderEditor(); } },
      el("div", { class: "trg" }, (trigOf(m).split("\n")[0]) || t("emptyShort"), m.triggers && m.triggers.length > 1 ? el("span", { class: "badge", text: "+" + (m.triggers.length - 1) }) : null,
        adv ? el("span", { class: "badge", text: t("adv") }) : null),
      el("div", { class: "sub", text: m.label || (typeof m.replace === "string" ? m.replace.replace(/\s+/g, " ") : "") })));
  });
  $("count").textContent = t("count", shown) + (shown !== S.data.matches.length ? ` / ${S.data.matches.length}` : "");
}

function field(label, hint, input) { return el("label", { class: "f" }, el("span", { text: label }), input, hint ? el("div", { class: "hint", text: hint }) : null); }

function insertAtCursor(ta, text, selectInner) {
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.setRangeText(text, s, e, "end"); ta.focus(); ta.dispatchEvent(new Event("input"));
}

function renderEditor() {
  const ed = $("editor"); ed.replaceChildren();
  if (!S.data) { ed.append(el("div", { class: "empty" }, el("b", { text: t("noFiles") + " " + (S.info ? S.info.dir : "") }), t("newFile"))); return; }
  if (S.tab === "vars") return renderVarsEditor(ed);
  const m = S.data.matches[S.sel];
  if (!m) {
    ed.append(el("div", { class: "empty" }, el("b", { text: t("emptyT") }), t("emptyD"), el("div", { style: "margin-top:16px" }, el("button", { class: "btn primary", onclick: newSnippet, text: t("newSnippet") }))));
    return;
  }
  const idx = S.sel, dups = allTriggers(idx);
  const card = el("div", { class: "card" });
  const msgs = el("div");
  const check = () => {
    msgs.replaceChildren();
    const tr = trigOf(m).split("\n").filter(x => x !== "");
    const add = (cls, txt) => msgs.append(el("div", { class: "msg " + cls, text: txt }));
    if (!tr.length && !m.regex) add("err", t("emptyTrig"));
    if (tr.some(x => dups[x])) add("warn", t("dupTrig"));
    if (tr.some(x => /\s/.test(x))) add("warn", t("spaceTrig"));
    if (!("replace" in m)) add("warn", t("noReplace"));
  };
  const trig = el("textarea", { rows: 2, style: "min-height:0;font-size:15px", spellcheck: "false", autocapitalize: "off" });
  trig.value = trigOf(m);
  trig.addEventListener("input", () => {
    const arr = trig.value.split("\n").map(x => x.replace(/\r/g, "")).filter(x => x !== "");
    delete m.trigger; delete m.triggers;
    if (arr.length > 1) m.triggers = arr; else m.trigger = arr[0] ?? "";
    reorder(m); markDirty(); check(); renderList();
  });
  const label = el("input", { type: "text", spellcheck: "false" }); label.value = m.label || "";
  label.addEventListener("input", () => { if (label.value) m.label = label.value; else delete m.label; reorder(m); markDirty(); renderList(); });

  card.append(el("h2", { text: t("snippets") }), msgs, field(t("trigger"), t("triggerHint"), trig), field(t("label"), t("labelHint"), label));

  if ("replace" in m && typeof m.replace === "string") {
    const ta = el("textarea", { rows: 8, spellcheck: "false" }); ta.value = m.replace;
    ta.addEventListener("input", () => { m.replace = ta.value; markDirty(); renderList(); });
    const needKeys = () => { if (!m.force_mode) { m.force_mode = "keys"; reorder(m); syncAdv(); } };
    const tool = el("div", { class: "toolbar" }, el("span", { class: "hint", style: "margin:0 4px 0 0;align-self:center", text: t("insert") }),
      chip(t("cursor"), "$|$", () => insertAtCursor(ta, "$|$")),
      chip(t("tab"), "\\t", () => { insertAtCursor(ta, "\t"); needKeys(); }),
      chip(t("enter"), "↵", () => { insertAtCursor(ta, "\n"); }),
      chip(t("date"), "{{data}}", () => { ensureVar(m, { name: "data", type: "date", params: { format: "%d/%m/%Y" } }); insertAtCursor(ta, "{{data}}"); syncAdv(); }),
      chip(t("clip"), "{{clipboard}}", () => { ensureVar(m, { name: "clipboard", type: "clipboard" }); insertAtCursor(ta, "{{clipboard}}"); syncAdv(); }));
    if (S.data.global_vars.length) {
      const sel = el("select", { class: "chip", style: "padding:2px 6px" }, el("option", { value: "", text: t("globalv") }), S.data.global_vars.map(g => el("option", { value: g.name, text: g.name })));
      sel.addEventListener("change", () => { if (sel.value) insertAtCursor(ta, "{{" + sel.value + "}}"); sel.value = ""; });
      tool.append(sel);
    }
    card.append(el("label", { class: "f" }, el("span", { text: t("replace") }), tool, ta));
  }

  // advanced
  const det = el("details", {}, el("summary", { text: t("advanced") }));
  const mode = el("select", {}, el("option", { value: "", text: t("modeAuto") }), el("option", { value: "keys", text: t("modeKeys") }), el("option", { value: "clipboard", text: t("modeClip") }));
  mode.addEventListener("change", () => { if (mode.value) m.force_mode = mode.value; else delete m.force_mode; reorder(m); markDirty(); });
  const cb = (key, text, hint) => {
    const i = el("input", { type: "checkbox" }); i.checked = !!m[key];
    i.addEventListener("change", () => { if (i.checked) m[key] = true; else delete m[key]; reorder(m); markDirty(); });
    return el("label", { class: "check" }, i, el("div", {}, text, hint ? el("div", { class: "hint", text: hint }) : null));
  };
  const varsTa = el("textarea", { rows: 6, spellcheck: "false" });
  const varsErr = el("div");
  varsTa.value = m.vars ? JSON.stringify(m.vars, null, 2) : "";
  varsTa.addEventListener("input", () => {
    varsErr.replaceChildren();
    if (!varsTa.value.trim()) { delete m.vars; markDirty(); return; }
    try { const v = JSON.parse(varsTa.value); if (!Array.isArray(v)) throw new Error("array"); m.vars = v; reorder(m); markDirty(); }
    catch (e) { varsErr.append(el("div", { class: "msg err", text: "JSON: " + e.message })); }
  });
  det.append(el("div", { class: "grid2" }, el("div", {}, field(t("mode"), "", mode)), el("div", {}, cb("left_word", t("leftWord"), t("leftWordHint")), cb("word", t("word")), cb("propagate_case", t("propagate")))),
    field(t("varsJson"), "", varsTa), varsErr);
  const extra = Object.keys(m).filter(k => !KNOWN.includes(k));
  if (extra.length) {
    const o = {}; extra.forEach(k => o[k] = m[k]);
    det.append(el("div", { class: "hint", text: t("extra") }), el("pre", { class: "code", text: JSON.stringify(o, null, 2) }));
  }
  card.append(det);
  const syncAdv = () => { mode.value = m.force_mode || ""; varsTa.value = m.vars ? JSON.stringify(m.vars, null, 2) : ""; markDirty(); };
  check();

  const acts = el("div", { class: "row", style: "margin-top:14px" },
    el("button", { class: "btn", text: t("dup"), onclick: () => { const c = structuredClone(m); if (c.trigger) c.trigger += "2"; S.data.matches.splice(idx + 1, 0, c); S.sel = idx + 1; markDirty(); render(); } }),
    el("button", { class: "btn danger", text: t("del"), onclick: () => { if (!confirm(t("delConfirm"))) return; S.data.matches.splice(idx, 1); S.sel = Math.min(idx, S.data.matches.length - 1); markDirty(); render(); } }));
  card.append(acts);
  ed.append(card, saveBar());
  mode.value = m.force_mode || "";
}
function chip(text, title, fn) { return el("button", { type: "button", class: "chip", title, text, onclick: fn }); }
function ensureVar(m, v) { m.vars = m.vars || []; if (!m.vars.some(x => x.name === v.name)) m.vars.push(v); reorder(m); }
const ORDER = ["trigger", "triggers", "label", "force_mode", "left_word", "word", "propagate_case", "replace", "vars"];
function reorder(m) {
  const copy = { ...m }; Object.keys(m).forEach(k => delete m[k]);
  ORDER.forEach(k => { if (k in copy) { m[k] = copy[k]; delete copy[k]; } });
  Object.assign(m, copy);
}
function saveBar() {
  return el("div", { class: "savebar" }, el("span", { class: "dirty", id: "dirtyMark", text: S.dirty ? t("dirty") : "" }),
    el("button", { class: "btn", text: t("reload"), onclick: async () => { if (confirmDiscard()) { await openFile(S.file); } } }),
    el("button", { class: "btn primary", text: t("save") + "  (Ctrl+S)", onclick: save }));
}

// ---------- variáveis globais ----------
function renderVarsEditor(ed) {
  const card = el("div", { class: "card" }, el("h2", { text: t("globalVars") }), el("div", { class: "hint", style: "margin-bottom:12px", text: t("gvHint") }));
  S.data.global_vars.forEach((g, i) => {
    const name = el("input", { type: "text", placeholder: t("gvName"), spellcheck: "false" }); name.value = g.name || "";
    name.addEventListener("input", () => { g.name = name.value; markDirty(); });
    const type = el("input", { type: "text", placeholder: t("gvType"), spellcheck: "false" }); type.value = g.type || "echo";
    const value = el("input", { type: "text", placeholder: t("gvValue"), spellcheck: "false", autocomplete: "off" });
    const isEcho = () => (g.type || "echo") === "echo";
    const paint = () => {
      if (isEcho()) { value.type = value.dataset.show ? "text" : "password"; value.value = g.params?.echo ?? ""; value.placeholder = t("gvValue"); }
      else { value.type = "text"; value.value = JSON.stringify(g.params || {}); value.placeholder = t("gvOther"); }
    };
    type.addEventListener("input", () => { g.type = type.value; paint(); markDirty(); });
    value.addEventListener("input", () => {
      if (isEcho()) g.params = { ...(g.params || {}), echo: value.value };
      else { try { g.params = JSON.parse(value.value || "{}"); value.style.outline = ""; } catch { value.style.outline = "2px solid var(--danger)"; return; } }
      markDirty();
    });
    const eye = el("button", { class: "btn sm", title: t("show"), text: "👁", onclick: () => { value.dataset.show = value.dataset.show ? "" : "1"; paint(); } });
    const del = el("button", { class: "btn sm danger", text: "✕", onclick: () => { S.data.global_vars.splice(i, 1); markDirty(); render(); } });
    paint();
    card.append(el("div", { class: "gv" }, name, type, value, el("div", { class: "row" }, eye, del)));
  });
  card.append(el("button", { class: "btn", text: t("gvNew"), onclick: () => { S.data.global_vars.push({ name: "", type: "echo", params: { echo: "" } }); markDirty(); renderEditor(); } }));
  ed.append(card, saveBar());
}

// ---------- ações ----------
function newSnippet() {
  if (S.tab !== "snip") { S.tab = "snip"; }
  S.data.matches.push({ trigger: "", replace: "" }); S.sel = S.data.matches.length - 1; S.q = ""; $("q").value = ""; markDirty(); render();
  const ta = document.querySelector("#editor textarea"); if (ta) ta.focus();
}
function dialog(title, body, buttons) {
  $("dlgT").textContent = title; const b = $("dlgB"); b.replaceChildren(...[].concat(body));
  const f = $("dlgF"); f.replaceChildren(...buttons); if (!$("dlg").open) $("dlg").showModal();
}
const closeDlg = () => $("dlg").close();
const closeBtn = () => el("button", { class: "btn", text: t("close"), onclick: closeDlg });

$("dlgX").onclick = closeDlg;
$("tabSnip").onclick = () => { S.tab = "snip"; S.sel = S.data && S.data.matches.length ? 0 : -1; render(); };
$("tabVars").onclick = () => { S.tab = "vars"; S.sel = -1; render(); };
$("q").addEventListener("input", e => { S.q = e.target.value; renderList(); });
$("fileSel").addEventListener("change", async e => { if (confirmDiscard()) await openFile(e.target.value); else e.target.value = S.file; });
$("btnNewFile").onclick = () => {
  const i = el("input", { type: "text", placeholder: t("newFileName"), spellcheck: "false" });
  dialog(t("newFile"), i, [el("button", { class: "btn", text: t("cancel"), onclick: closeDlg }), el("button", { class: "btn primary", text: t("create"), onclick: async () => {
    try { const r = await api("/api/newfile", { name: i.value }); closeDlg(); await refreshInfo(); await openFile(r.name); } catch (e) { alert(e.message); } } })]);
  i.focus();
};
$("btnNew").onclick = () => { if (S.data) newSnippet(); };
$("btnImport").onclick = () => $("fileImport").click();
$("fileImport").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const r = await api("/api/import-beeftext", { json: await f.text() });
    const skip = el("input", { type: "checkbox" }); skip.checked = true;
    const body = [el("div", { class: "msg", text: t("importFound", r.matches.length) + " " + t("importNote") }),
      el("label", { class: "check" }, skip, el("div", { text: t("importSkipDup") }))];
    if (r.warnings.length) body.push(el("details", { open: true }, el("summary", { text: t("importWarn") + " (" + r.warnings.length + ")" }),
      el("pre", { class: "code", text: r.warnings.join("\n") })));
    body.push(el("pre", { class: "code", text: r.matches.map(m => m.trigger + "  →  " + String(m.replace).replace(/\s+/g, " ").slice(0, 70)).join("\n") }));
    dialog(t("importTitle"), body, [el("button", { class: "btn", text: t("cancel"), onclick: closeDlg }),
      el("button", { class: "btn primary", text: t("importAdd"), onclick: () => {
        if (!S.data) return;
        S.tab = "snip"; const have = allTriggers(-1); let n = 0;
        for (const m of r.matches) { if (skip.checked && have[m.trigger]) continue; S.data.matches.push(m); n++; }
        S.sel = S.data.matches.length - n; if (S.sel < 0) S.sel = 0;
        markDirty(); render(); closeDlg(); toast(t("importFound", n));
      } })]);
  } catch (err) { alert(t("error") + ": " + err.message); }
});
$("btnYaml").onclick = async () => {
  if (!S.data) return;
  const r = await api("/api/preview", { matches: S.data.matches, global_vars: S.data.global_vars, extra: S.data.extra });
  dialog(t("yamlTitle") + " — " + S.file, el("pre", { class: "code", text: r.yaml }), [
    el("button", { class: "btn", text: t("copy"), onclick: () => { navigator.clipboard.writeText(r.yaml).then(() => toast(t("copied"))); } }), closeBtn()]);
};
$("btnBackups").onclick = async () => {
  await refreshInfo();
  const bs = S.info.backups;
  const body = [el("div", { class: "hint", style: "margin-bottom:10px", text: t("backupHint") })];
  if (!bs.length) body.push(el("div", { class: "empty", text: t("backupNone") }));
  bs.forEach(b => body.push(el("div", { class: "row", style: "justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)" },
    el("code", { text: b }), el("span", { class: "row" },
      el("button", { class: "btn sm", text: t("view"), onclick: async () => { const x = await api("/api/backup?name=" + encodeURIComponent(b)); dialog(b, el("pre", { class: "code", text: x }), [closeBtn()]); } }),
      el("button", { class: "btn sm", text: t("restore"), onclick: async () => {
        if (!confirmDiscard()) return;
        const target = prompt(LANG === "pt" ? "Restaurar sobre qual arquivo?" : "Restore over which file?", S.file); if (!target) return;
        try { await api("/api/restore", { name: b, file: target }); closeDlg(); await openFile(target); toast(t("restoreOk")); } catch (e) { alert(e.message); }
      } })))));
  dialog(t("backupTitle"), body, [closeBtn()]);
};
$("btnQuit").onclick = async () => {
  if (!confirm(t("quitConfirm"))) return;
  try { await api("/api/shutdown", {}); } catch {}
  document.body.replaceChildren(el("div", { class: "empty", style: "margin-top:20vh" }, el("b", { text: t("bye") })));
};
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); if (S.data) save(); } });
window.addEventListener("beforeunload", e => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });
init().catch(e => document.body.append(el("div", { class: "empty", text: t("error") + ": " + e.message })));
</script>
</body>
